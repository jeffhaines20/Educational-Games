  <!-- Record script files that fail to load (missing chapter, syntax error) so the game can say so. -->
  <script>
    window.SS_LOAD_ERRORS = [];
    window.addEventListener("error", function (e) {
      if (window.SS_LOAD_DONE) return;
      var t = e && e.target;
      if (t && t.tagName === "SCRIPT") window.SS_LOAD_ERRORS.push({ src: t.getAttribute("src") || "", kind: "missing" });
      else if (e && e.filename) window.SS_LOAD_ERRORS.push({ src: e.filename, kind: "error", message: String(e.message || "") });
    }, true);
    document.addEventListener("DOMContentLoaded", function () { window.SS_LOAD_DONE = true; });
  </script>

  <!-- Python (Pyodide) and the code editor (CodeMirror) come from these CDNs. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Self-hosted fonts (assets/fonts, SIL OFL): no third-party font service is contacted. -->
  <link rel="stylesheet" href="css/fonts.css">

  <!-- The code editor (CodeMirror 5) is loaded on demand by js/ui/editor.js from cdnjs;
       if it is blocked, a plain text editor is used instead. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript>

  <div id="sr-alert" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="print-root"></div>
